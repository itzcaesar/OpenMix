# Build the MkDocs Material documentation site and deploy it to GitHub Pages.
# Free hosting: GitHub Pages (no extra service, no secrets needed).
# After the first push of this workflow, enable Pages once in the repo:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
# The site is then live at https://itzcaesar.github.io/OpenMix/

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs mkdocs-material

      - name: "Build site (strict: warnings are errors)"
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
