name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the build to a release on version tags

jobs:
  windows:
    name: Windows x64 (Release)
    runs-on: windows-latest

    steps:
      - name: Check out (with JUCE submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # The pinned DeepFilterNet 0.5.6 dependency emits warnings with current stable Rust.
          # Keep them informational instead of using this action's default `-D warnings`.
          rustflags: ""

      - name: Configure
        # No preset here: let CMake pick whichever Visual Studio the runner has.
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Signs only when the repository has the SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD secrets
      # (see docs/SIGNING.md); otherwise the script notes it and the build goes on unsigned.
      - name: Sign binaries
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./installer/sign.ps1 build/OpenMix_artefacts/Release/OpenMix.exe build/OpenMix_artefacts/Release/df.dll

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/OpenMix_artefacts/Release/OpenMix.exe dist/
          Copy-Item build/OpenMix_artefacts/Release/df.dll dist/
          Copy-Item README.md, LICENSE dist/
          New-Item -ItemType Directory -Force dist/DeepFilterNet | Out-Null
          Copy-Item external/DeepFilterNet/LICENSE-MIT, external/DeepFilterNet/LICENSE-APACHE dist/DeepFilterNet/
          Compress-Archive -Path dist/* -DestinationPath OpenMix-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenMix-windows-x64
          path: OpenMix-windows-x64.zip

      - name: Build installer (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$PWD\dist" installer\OpenMix.iss

      - name: Sign installer (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./installer/sign.ps1 (Get-ChildItem installer-out/*.exe).FullName

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            OpenMix-windows-x64.zip
            installer-out/*.exe
